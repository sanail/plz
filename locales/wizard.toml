# `plz config init` and `plz config show`.
#
# The `#` comment lines of `config show` are prose and translated; the values
# beside them are data and are not. See locales/errors.toml for the shared rules.
_version = 2

[wizard.choose_a_provider]
en = "Setting up plz. Choose a provider:"
ru = "Настройка plz. Выберите провайдера:"
es = "Configurando plz. Elija un proveedor:"
fr = "Configuration de plz. Choisissez un fournisseur :"
de = "plz wird eingerichtet. Wählen Sie einen Anbieter:"

[wizard.number]
en = "Number"
ru = "Номер"
es = "Número"
fr = "Numéro"
de = "Nummer"

[wizard.base_url]
en = "Base URL"
ru = "Базовый URL"
es = "URL base"
fr = "URL de base"
de = "Basis-URL"

[wizard.model]
en = "Model"
ru = "Модель"
es = "Modelo"
fr = "Modèle"
de = "Modell"

[wizard.api_key]
en = "API key"
ru = "Ключ API"
es = "Clave de API"
fr = "Clé d'API"
de = "API-Schlüssel"

[wizard.overwrite]
en = "%{path} already exists. Overwrite?"
ru = "%{path} уже существует. Перезаписать?"
es = "%{path} ya existe. ¿Sobrescribir?"
fr = "%{path} existe déjà. L'écraser ?"
de = "%{path} existiert bereits. Überschreiben?"

[wizard.get_a_key]
en = "Get a key here: %{hint}"
ru = "Получить ключ здесь: %{hint}"
es = "Obtenga una clave aquí: %{hint}"
fr = "Obtenez une clé ici : %{hint}"
de = "Einen Schlüssel erhalten Sie hier: %{hint}"

[wizard.leave_blank]
en = "Leave this blank if the key is already set in %{var} or PLZ_API_KEY."
ru = "Оставьте пустым, если ключ уже задан в %{var} или PLZ_API_KEY."
es = "Déjelo en blanco si la clave ya está definida en %{var} o PLZ_API_KEY."
fr = "Laissez vide si la clé est déjà définie dans %{var} ou PLZ_API_KEY."
de = "Lassen Sie das Feld leer, wenn der Schlüssel bereits in %{var} oder PLZ_API_KEY gesetzt ist."

[wizard.saved]
en = "Configuration saved to %{path}"
ru = "Конфигурация сохранена в %{path}"
es = "Configuración guardada en %{path}"
fr = "Configuration enregistrée dans %{path}"
de = "Konfiguration in %{path} gespeichert"

[wizard.no_key_set]
en = "Warning: no key set, neither in the config nor in the environment."
ru = "Внимание: ключ не задан ни в конфигурации, ни в окружении."
es = "Advertencia: no hay ninguna clave definida, ni en la configuración ni en el entorno."
fr = "Attention : aucune clé définie, ni dans la configuration ni dans l'environnement."
de = "Warnung: kein Schlüssel gesetzt, weder in der Konfiguration noch in der Umgebung."

# Preset entries. Brand names — DeepSeek, OpenAI, OpenRouter — are not here:
