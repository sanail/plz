# `plz hook <shell> --install`.
#
# The commands quoted in these messages are typed back verbatim, so
# `Set-ExecutionPolicy`, `RemoteSigned`, `Get-ExecutionPolicy -List`,
# `$PROFILE` and `plz hook` stay as they are in every language. See
# locales/errors.toml for the shared rules.
_version = 2

