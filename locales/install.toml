# Printed by `plz hook cmd`, whose output may be redirected into a .bat file:
# every line must stay commented with `@rem `, or the file becomes executable.
# A test checks that in all languages.
[install.cmd_explanation]
en = """
@rem There is no wrapper for cmd.exe.
@rem
@rem cmd.exe has no functions, and doskey macros can neither branch nor read the
@rem result file, so they cannot run the command in the current session.
@rem
@rem plz works in cmd.exe without a wrapper: the command runs in a child
@rem process. Only commands that change the session's own state (cd, set) have
@rem no effect; run those by hand. plz warns you when that happens.
@rem
@rem For the full experience, use PowerShell instead:
@rem     plz hook powershell --install
"""
ru = """
@rem Обёртки для cmd.exe не существует.
@rem
@rem В cmd.exe нет функций, а макросы doskey не умеют ни ветвиться, ни читать
@rem файл результата, поэтому выполнить команду в текущей сессии они не могут.
@rem
@rem plz работает в cmd.exe и без обёртки: команда выполняется в дочернем
@rem процессе. Не действуют только команды, меняющие состояние самой сессии
@rem (cd, set) — их выполняйте вручную. plz предупредит, когда это случится.
@rem
@rem Чтобы получить все возможности, используйте PowerShell:
@rem     plz hook powershell --install
"""
es = """
@rem No existe un envoltorio para cmd.exe.
@rem
@rem cmd.exe no tiene funciones, y las macros doskey no pueden ramificarse ni
@rem leer el archivo de resultado, así que no pueden ejecutar el comando en la
@rem sesión actual.
@rem
@rem plz funciona en cmd.exe sin envoltorio: el comando se ejecuta en un proceso
@rem hijo. Solo los comandos que cambian el estado de la propia sesión (cd, set)
@rem no surten efecto; ejecútelos a mano. plz le avisa cuando ocurre.
@rem
@rem Para la experiencia completa, use PowerShell:
@rem     plz hook powershell --install
"""
fr = """
@rem Il n'existe pas d'enveloppe pour cmd.exe.
@rem
@rem cmd.exe n'a pas de fonctions, et les macros doskey ne savent ni brancher ni
@rem lire le fichier de résultat : elles ne peuvent donc pas exécuter la commande
@rem dans la session courante.
@rem
@rem plz fonctionne dans cmd.exe sans enveloppe : la commande s'exécute dans un
@rem processus enfant. Seules les commandes qui modifient l'état de la session
@rem elle-même (cd, set) restent sans effet ; lancez-les à la main. plz vous
@rem prévient quand cela arrive.
@rem
@rem Pour l'expérience complète, utilisez PowerShell :
@rem     plz hook powershell --install
"""
de = """
@rem Für cmd.exe gibt es keinen Wrapper.
@rem
@rem cmd.exe kennt keine Funktionen, und doskey-Makros können weder verzweigen
@rem noch die Ergebnisdatei lesen — sie können den Befehl also nicht in der
@rem aktuellen Sitzung ausführen.
@rem
@rem plz funktioniert in cmd.exe auch ohne Wrapper: Der Befehl läuft in einem
@rem Kindprozess. Nur Befehle, die den Zustand der Sitzung selbst ändern
@rem (cd, set), bleiben wirkungslos; führen Sie diese von Hand aus. plz weist
@rem Sie darauf hin, wenn das passiert.
@rem
@rem Für den vollen Funktionsumfang verwenden Sie PowerShell:
@rem     plz hook powershell --install
"""
