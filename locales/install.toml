es = "\n%{policy} permite ejecutar sus propios scripts locales y sigue bloqueando\nlos scripts sin firmar descargados de internet. Se aplica solo a su cuenta\nde usuario y no requiere permisos de administrador."
fr = "\n%{policy} autorise vos propres scripts locaux et continue de bloquer les\nscripts non signés téléchargés depuis internet. Cela ne concerne que votre\ncompte utilisateur et ne demande aucun droit d'administrateur."
de = "\n%{policy} lässt Ihre eigenen lokalen Skripte zu und blockiert weiterhin\nunsignierte Skripte aus dem Internet. Es gilt nur für Ihr Benutzerkonto\nund erfordert keine Administratorrechte."

