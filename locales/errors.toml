fr = "aucune configuration trouvée dans %{path}.\nExécutez `plz config init` pour la créer."
de = "keine Konfiguration unter %{path} gefunden.\nFühren Sie `plz config init` aus, um eine anzulegen."

[errors.no_config_to_edit]
en = "no configuration found at %{path}.\nRun `plz config init`."
