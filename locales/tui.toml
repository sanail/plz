# The inline picker and the full-screen interactive mode.
#
# Two things to watch here. Key names — Enter, Esc, Tab, Ctrl+R — are what is
# printed on the keyboard and are never translated. And the hint bars are
# length-critical: the picker truncates its footer to the terminal width, so a
# hint that outgrows it silently loses its last keys. Tests cap both bars.
_version = 2

[tui.query_title]
en = " What do you need to do? "
ru = " Что нужно сделать? "
es = " ¿Qué necesita hacer? "
fr = " Que faut-il faire ? "
de = " Was ist zu tun? "

