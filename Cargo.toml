[package]
name = "plz"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Describe a task in plain language, get a command ready for your OS and shell"
license = "MIT"
repository = "https://github.com/sanail/plz"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
ratatui = "0.30"
# rustls instead of native TLS: otherwise a Linux build needs system OpenSSL and
# a Windows build clashes with the MSVC toolchain. Root certificates come from
# the system store so corporate proxies with their own CA keep working, with the
# bundled set as a fallback for bare containers.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "json",
    "rustls",
    "rustls-native-certs",
    "webpki-roots",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
