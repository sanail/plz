[package]
name = "plz"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Describe a task in plain language, get a command ready for your OS and shell"
license = "MIT"
repository = "https://github.com/sanail/plz"
# The Homebrew formula dist generates carries a homepage field, and it warns
# when there is nothing to put there.
homepage = "https://github.com/sanail/plz"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
ratatui = "0.30"
# rustls instead of native TLS: otherwise a Linux build needs system OpenSSL and
# a Windows build clashes with the MSVC toolchain. Root certificates come from
# the system store so corporate proxies with their own CA keep working, with the
# bundled set as a fallback for bare containers.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "json",
    "rustls",
    "rustls-native-certs",
    "webpki-roots",
] }
# The catalogues are embedded at compile time; the parsers and the file walker
# that does it sit behind the `codegen` feature and stay out of the binary.
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The OS language, which is not an environment variable on macOS or Windows.
sys-locale = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with. It inherits the release profile
# unchanged: the settings there are tuned for the size of a downloaded binary,
# which is exactly what dist ships.
[profile.dist]
inherits = "release"
